name: Deploy static practice site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out the committed static bundle
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Validate Pages bundle
        shell: bash
        run: |
          set -euo pipefail
          test -s dist/index.html
          test -d dist

          python3 - <<'PY'
          import hashlib, json, re, subprocess
          from html.parser import HTMLParser
          from pathlib import Path

          root = Path("dist").resolve()
          class Assets(HTMLParser):
              def handle_starttag(self, tag, attrs):
                  attrs = dict(attrs)
                  for name in ("src", "href"):
                      value = attrs.get(name)
                      if value:
                          if value.startswith(("http://", "https://", "//")):
                              is_script = tag == "script" and name == "src"
                              is_stylesheet = tag == "link" and name == "href" and "stylesheet" in attrs.get("rel", "").split()
                              if is_script or is_stylesheet:
                                  raise SystemExit(f"External runtime asset is not self-hosted: {value}")
                          refs.append(value)

          refs = []
          parser = Assets()
          parser.feed((root / "index.html").read_text(encoding="utf-8"))
          for ref in refs:
              if ref.startswith(("#", "data:", "https://", "http://", "mailto:", "tel:", "//")):
                  continue
              if ref.startswith("/"):
                  raise SystemExit(f"Root-relative asset breaks repository Pages paths: {ref}")
              path = (root / ref.split("?", 1)[0]).resolve()
              if root not in path.parents and path != root:
                  raise SystemExit(f"Index asset escapes dist/: {ref}")
              if not path.is_file():
                  raise SystemExit(f"Missing local index asset: {ref}")

          files = [path for path in root.rglob("*") if path.is_file()]
          forbidden = (".pt", ".pth", ".sqlite", ".sqlite3", ".db")
          for path in files:
              if ".openai" in path.parts or path.name.startswith(".env") or path.name.endswith(forbidden):
                  raise SystemExit(f"Operational or private file included in dist/: {path.relative_to(root)}")
              if path.stat().st_size > 100 * 1024 * 1024:
                  raise SystemExit(f"File exceeds GitHub's 100 MiB Git file limit: {path.relative_to(root)}")

          config = json.loads((root / "config.json").read_text())
          if config.get("execution") != "browser":
              raise SystemExit("Deployment must use browser-only execution")
          def local_file(ref):
              if not isinstance(ref, str) or not ref.startswith("./") or ":" in ref or "?" in ref or "#" in ref:
                  raise SystemExit("Model asset is not a relative static file")
              path = (root / ref).resolve()
              if root not in path.parents or not path.is_file() or path.is_symlink():
                  raise SystemExit("Model asset escapes or is missing from dist/")
              return path
          models = config.get("models")
          if not isinstance(models, list) or not models:
              raise SystemExit("No browser models configured")
          raw = re.compile(r"https://raw\.githubusercontent\.com/philipontheroof/great-kingdom-practice/([0-9a-f]{40})/model-files/([0-9a-f]{64})/model\.onnx")
          def digest_file(path):
              with path.open("rb") as stream:
                  return hashlib.file_digest(stream, "sha256").hexdigest()
          for model in models:
              manifest = json.loads(local_file(model["manifest_url"]).read_text())
              if manifest["model_id"] != model["id"] or manifest["sha256"] != model["sha256"]:
                  raise SystemExit("Model identity mismatch")
              hashes = manifest["asset_sha256"]
              assets = manifest["assets"]
              model_url = manifest["model_url"]
              if assets.get("model") != model_url or set(assets.values()) != set(hashes):
                  raise SystemExit("Manifest asset routes mismatch")
              if hashes[model_url] != manifest["onnx_sha256"]:
                  raise SystemExit("Exported ONNX identity mismatch")
              for ref, expected in hashes.items():
                  if not isinstance(expected, str) or not re.fullmatch(r"[0-9a-f]{64}", expected):
                      raise SystemExit("Invalid asset SHA")
                  if ref == model_url and ref.startswith("https://"):
                      match = raw.fullmatch(ref)
                      if match is None or match.group(2) != model["sha256"]:
                          raise SystemExit("External model URL is not an immutable approved path")
                      commit, source_sha = match.groups()
                      model_path = f"model-files/{source_sha}/model.onnx"
                      path = Path(model_path)
                      if path.is_symlink() or not path.is_file() or path.stat().st_size > 25 * 1024 * 1024:
                          raise SystemExit("External ONNX file is missing or too large")
                      if digest_file(path) != expected:
                          raise SystemExit("External ONNX file SHA mismatch")
                      if subprocess.run(["git", "merge-base", "--is-ancestor", commit, "HEAD"],
                                        stdout=subprocess.DEVNULL, stderr=subprocess.DEVNULL).returncode:
                          raise SystemExit("External model commit is not in current history")
                      blob = subprocess.Popen(["git", "show", f"{commit}:{model_path}"], stdout=subprocess.PIPE)
                      actual = hashlib.file_digest(blob.stdout, "sha256").hexdigest()
                      blob.stdout.close()
                      if blob.wait() != 0 or actual != expected:
                          raise SystemExit("Pinned Git model blob SHA mismatch")
                  else:
                      path = local_file(ref)
                      if ref == model_url and path.stat().st_size > 25 * 1024 * 1024:
                          raise SystemExit("ONNX model exceeds the 25 MiB repository target")
                      if digest_file(path) != expected:
                          raise SystemExit("Static model/runtime asset SHA mismatch")

          total = sum(path.stat().st_size for path in files)
          if total > 1024 * 1024 * 1024:
              raise SystemExit("Pages bundle exceeds GitHub's 1 GiB published-site limit")
          print(f"Validated {len(files)} files ({total:,} bytes), including {len(models)} model(s).")
          PY

          touch dist/.nojekyll

      - name: Upload static site artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist/
          include-hidden-files: true
          retention-days: 1

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
